<!doctype html>
<html><head><meta charset="utf-8"><title>Web Agent</title>
<script src="/static/app.js" defer></script>
<style>
:root{--bd:#ddd;--mut:#666;--bg:#f7f7f7;--ok:#2a7;--bad:#c33;--run:#fa0}
*{box-sizing:border-box}
body{font-family:system-ui;margin:0;height:100vh;display:grid;grid-template-rows:1fr auto}
#layout{display:grid;grid-template-columns:260px 1fr;height:100%;min-height:0}
#sidebar{border-right:1px solid var(--bd);overflow-y:auto;padding:.6rem;background:#fafafa;transition:width .15s}
#sidebar.collapsed{width:36px;padding:.4rem;overflow:hidden}
#sidebar.collapsed .label{display:none}
#sidebar h2{font-size:.7rem;text-transform:uppercase;color:var(--mut);margin:.6rem 0 .2rem;letter-spacing:.05em}
.session{padding:.4rem .5rem;border-radius:4px;cursor:pointer;font-size:.85rem;margin-bottom:.2rem}
.session:hover{background:#eef}
.session.active{background:#dde}
.session .goal{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.session .meta{color:var(--mut);font-size:.7rem;display:block;margin-top:.15rem}
.pill{display:inline-block;padding:0 .35rem;border-radius:8px;font-size:.65rem;color:#fff;margin-left:.3rem;vertical-align:middle}
.pill.success{background:var(--ok)} .pill.failed{background:var(--bad)} .pill.running{background:var(--run)}
#layout > main{display:flex;flex-direction:column;min-height:0}
#transcript{flex:1;overflow-y:auto;padding:1rem}
.card{border:1px solid var(--bd);border-radius:6px;padding:.45rem .65rem;margin:.35rem 0;cursor:pointer;font-family:monospace;font-size:.85rem;line-height:1.4}
.card.expanded{cursor:default}
.card .summary{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .detail{display:none;margin-top:.5rem}
.card.expanded .detail{display:block}
.card .thought{color:var(--mut);font-style:italic;font-family:system-ui;margin-bottom:.3rem}
.card pre{white-space:pre-wrap;background:var(--bg);padding:.4rem;margin:.2rem 0;border-radius:4px;font-size:.8rem}
.card.thinking{border-style:dashed;color:var(--mut)}
.card.warning{border-left:3px solid var(--run);background:#fff8e1}
.card.thinking .summary::after{content:" …";animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}
#qa{display:none;margin:.6rem 1rem;padding:.6rem;border:2px solid var(--run);border-radius:6px}
#qa input{margin:0 .4rem;padding:.3rem;font:inherit;border:1px solid var(--bd);border-radius:3px;width:60%}
#input{border-top:1px solid var(--bd);padding:.6rem;display:flex;gap:.5rem}
#goal{flex:1;font:inherit;padding:.4rem;border:1px solid var(--bd);border-radius:4px;resize:vertical;min-height:2.4rem}
#run{padding:0 1.2rem;cursor:pointer;font:inherit;border:1px solid var(--bd);border-radius:4px;background:#fff}
#run:disabled{opacity:.5;cursor:not-allowed}
#monitors{border-top:1px solid var(--bd);padding:.4rem .8rem;display:flex;gap:1.4rem;font-size:.78rem;background:#fafafa;color:var(--mut);align-items:center}
.led{display:inline-block;width:.65rem;height:.65rem;border-radius:50%;margin-right:.35rem;background:#ccc;vertical-align:middle}
.led.up{background:var(--ok)} .led.down{background:var(--bad)}
button{cursor:pointer;font:inherit}
#collapse,#newchat{border:1px solid var(--bd);background:#fff;border-radius:4px}
#collapse{float:right;padding:.1rem .4rem}
#newchat{display:block;width:100%;margin:.4rem 0 .8rem;padding:.4rem;text-align:left}
</style></head>
<body>
<div id=layout>
  <aside id=sidebar>
    <button id=collapse title="Toggle sidebar">☰</button>
    <button id=newchat class=label>+ New chat</button>
    <h2 class=label>Sessions</h2>
    <div id=sessions class=label></div>
  </aside>
  <main>
    <div id=transcript></div>
    <div id=qa><span id=qa-question></span><input id=qa-answer><button id=qa-send>Send</button></div>
    <form id=input>
      <textarea id=goal rows=2 placeholder="Goal..."></textarea>
      <button id=run type=submit>Run</button>
    </form>
  </main>
</div>
<div id=monitors>
  <span><span id=led-server class=led></span>server</span>
  <span><span id=led-llm class=led></span>llm <span id=llm-latency></span></span>
  <span>tokens <span id=tok-prompt>0</span> in / <span id=tok-completion>0</span> out</span>
  <span>steps <span id=step-count>0</span>/<span id=step-max>?</span></span>
  <span id=run-status></span>
</div>
</body></html>
